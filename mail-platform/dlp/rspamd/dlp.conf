# /etc/rspamd/local.d/dlp.conf
# Settings for the mailstack DLP plugin (rspamd/dlp.lua).

dlp {
  enabled = true;
  url = "http://127.0.0.1:11333/inspect";
  timeout = 10.0;

  # Outbound control: only inspect authenticated submission.
  authenticated_only = true;

  # 50 MB
  max_size = 52428800;

  # "defer" = fail closed (451, sender retries). Correct for a compliance
  # control: if inspection cannot run, the data does not leave.
  # "allow"  = fail open. Only for a monitoring-only pilot, and it stamps
  #            X-DLP-Action: not-inspected so the gap stays visible.
  on_error = "defer";
  on_oversize = "defer";

  symbol = "DLP_MATCH";
}
